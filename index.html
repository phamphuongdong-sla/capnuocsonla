<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Báo Cáo Sản Lượng - Công ty CP Cấp nước Sơn La</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans">

  <!-- TOP BAR -->
  <nav class="bg-blue-800 text-white p-4 flex justify-between items-center shadow-lg">
    <h1 class="text-xl font-bold uppercase tracking-wider">Hệ thống Quản lý Sản lượng - Cấp nước Sơn La</h1>
    <div id="userProfile" class="flex items-center space-x-3">
      <div class="flex flex-col text-right mr-2">
          <span class="text-sm font-semibold">Phạm Phương Đông</span>
          <span class="text-xs text-blue-200">Quản lý Khách hàng (Admin)</span>
      </div>
      <div class="h-8 w-8 rounded-full bg-blue-500 flex items-center justify-center font-bold">P</div>
      <button class="bg-red-500 hover:bg-red-600 px-3 py-1.5 rounded text-sm font-medium transition ml-2">Đăng xuất</button>
    </div>
  </nav>

  <div class="container mx-auto p-6">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- FORM NHẬP CHỈ SỐ -->
      <div class="bg-white p-6 rounded-xl shadow-md border-t-4 border-blue-600">
        <h2 class="text-lg font-semibold text-blue-800 mb-4 border-b pb-2">NHẬP CHỈ SỐ HÀNG NGÀY</h2>
        <form id="inputForm" class="space-y-4">
          <div>
            <label class="block text-sm font-medium mb-1">Ngày ghi nhận</label>
            <input type="date" id="ngayGhi" class="w-full border rounded p-2 focus:ring-blue-500 focus:border-blue-500" required>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Đơn vị</label>
            <select id="maDonVi" class="w-full border rounded p-2 bg-gray-50 focus:ring-blue-500 focus:border-blue-500" required>
                <option value="XNTP1">Xí nghiệp Cấp nước TP1</option>
                <option value="XNTP2">Xí nghiệp Cấp nước TP2</option>
                <option value="MS">XNCN Mai Sơn</option>
                <option value="MC">XNCN Mộc Châu</option>
                <option value="YC">XNCN Yên Châu</option>
                <option value="PY">XNCN Phù Yên</option>
                <option value="BY">XNCN Bắc Yên</option>
                <option value="TC">XNCN Thuận Châu</option>
                <option value="SM">XNCN Sông Mã</option>
                <option value="SC">XNCN Sốp Cộp</option>
                <option value="ML">XNCN Mường La</option>
                <option value="QN">XNCN Quỳnh Nhai</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Trạm bơm / Nhà máy</label>
            <select id="maTram" class="w-full border rounded p-2 focus:ring-blue-500 focus:border-blue-500" required>
                <option>Nhà máy chính TP1</option>
                <option>VBIC Trạm Bản Mòng</option>
                <option>Trạm 19/5</option>
                <option>Trạm Cò Nòi</option>
            </select>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium mb-1">Chỉ số đầu</label>
              <input type="number" id="chiSoDau" class="w-full border rounded p-2" placeholder="0" required>
            </div>
            <div>
              <label class="block text-sm font-medium mb-1">Chỉ số cuối</label>
              <input type="number" id="chiSoCuoi" class="w-full border rounded p-2" placeholder="0" required>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium mb-1">Xả rửa (m³)</label>
                <input type="number" id="sanLuongXaRua" class="w-full border rounded p-2" placeholder="0" value="0">
              </div>
              <div>
                <label class="block text-sm font-medium mb-1 text-blue-700">Sản lượng phát ra</label>
                <input type="number" id="sanLuongPhat" class="w-full border rounded p-2 bg-blue-50 font-bold text-blue-900" readonly>
              </div>
          </div>
          <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium p-3 rounded-lg transition shadow-md mt-2">GỬI SỐ LIỆU LÊN HỆ THỐNG</button>
        </form>
      </div>

      <!-- DASHBOARD TỔNG THỂ -->
      <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-md border-t-4 border-emerald-500 space-y-4">
        <div class="flex flex-wrap justify-between items-center border-b pb-3 gap-2">
          <h2 class="text-lg font-semibold text-emerald-800">DASHBOARD TỔNG HỢP</h2>
          
          <!-- BỘ LỌC -->
          <div class="flex items-center space-x-2 text-sm bg-gray-50 p-2 rounded-lg border">
            <span class="font-medium text-gray-600">Lọc ngày:</span>
            <input type="date" id="tuNgay" class="border rounded p-1">
            <span>đến</span>
            <input type="date" id="denNgay" class="border rounded p-1">
            <button id="btnLoc" class="bg-emerald-600 text-white px-4 py-1.5 rounded hover:bg-emerald-700 font-medium transition">Đồng bộ & Lọc</button>
          </div>
        </div>

        <!-- KPI CARDS -->
        <div class="grid grid-cols-3 gap-4 mt-4">
          <div class="bg-blue-50 p-4 rounded-xl text-center shadow-sm border border-blue-100">
            <div class="text-sm font-medium text-blue-600 mb-1">TỔNG SẢN LƯỢNG</div>
            <div class="text-3xl font-bold text-blue-800" id="kpiTong">-- <span class="text-lg font-normal">m³</span></div>
          </div>
          <div class="bg-emerald-50 p-4 rounded-xl text-center shadow-sm border border-emerald-100">
            <div class="text-sm font-medium text-emerald-600 mb-1">TRUNG BÌNH / NGÀY</div>
            <div class="text-3xl font-bold text-emerald-800" id="kpiTB">-- <span class="text-lg font-normal">m³</span></div>
          </div>
          <div class="bg-amber-50 p-4 rounded-xl text-center shadow-sm border border-amber-100">
            <div class="text-sm font-medium text-amber-600 mb-1">NGÀY ĐỈNH ĐIỂM</div>
            <div class="text-3xl font-bold text-amber-800" id="kpiMax">-- <span class="text-lg font-normal">m³</span></div>
          </div>
        </div>

        <!-- CHARTS -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">
            <div class="border rounded-lg p-3 relative">
                <canvas id="lineChart"></canvas>
            </div>
            <div class="border rounded-lg p-3 relative">
                <canvas id="barChart"></canvas>
            </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    // --- CẤU HÌNH API GOOGLE APPS SCRIPT ---
    const API_URL = "https://script.google.com/macros/s/AKfycbzrDVCpQhmjAea6Ib8I3IBJpU4esN96P1814ca0DuW6gZ65RZvlMAdIjqPURLo8O7hE5Q/exec";

    // Tự động tính sản lượng
    const elDau = document.getElementById('chiSoDau');
    const elCuoi = document.getElementById('chiSoCuoi');
    const elPhat = document.getElementById('sanLuongPhat');
    const elXaRua = document.getElementById('sanLuongXaRua');

    function calc() {
      let d = parseFloat(elDau.value) || 0;
      let c = parseFloat(elCuoi.value) || 0;
      let xr = parseFloat(elXaRua.value) || 0;
      elPhat.value = Math.max(0, (c - d) - xr);
    }
    elDau.addEventListener('input', calc);
    elCuoi.addEventListener('input', calc);
    elXaRua.addEventListener('input', calc);

    // Set ngày mặc định (chốt từ 27 tháng trước đến 27 tháng này)
    document.getElementById('ngayGhi').valueAsDate = new Date();
    let today = new Date();
    document.getElementById('tuNgay').valueAsDate = new Date(today.getFullYear(), today.getMonth()-1, 27);
    document.getElementById('denNgay').valueAsDate = new Date(today.getFullYear(), today.getMonth(), 26);

    // Xử lý gửi Form nhập liệu (POST)
    document.getElementById('inputForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const payload = {
            ngayGhi: document.getElementById('ngayGhi').value,
            maDonVi: document.getElementById('maDonVi').value,
            maTram: document.getElementById('maTram').value,
            chiSoDau: document.getElementById('chiSoDau').value,
            chiSoCuoi: document.getElementById('chiSoCuoi').value,
            sanLuongPhat: document.getElementById('sanLuongPhat').value,
            sanLuongXaRua: document.getElementById('sanLuongXaRua').value,
            nguoiNhap: 'dong.pp@sonlawater.vn' // Chỗ này sẽ lấy động từ đăng nhập sau
        };
        
        // Gửi qua API
        const btnSubmit = e.target.querySelector('button[type="submit"]');
        const oldText = btnSubmit.innerText;
        btnSubmit.innerText = "Đang gửi...";
        btnSubmit.disabled = true;

        fetch(API_URL, {
            method: 'POST',
            mode: 'no-cors', // Dùng no-cors để bypass vấn đề CORS tạm thời
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
        }).then(() => {
            alert("Đã gửi dữ liệu thành công!");
            btnSubmit.innerText = oldText;
            btnSubmit.disabled = false;
            document.getElementById('inputForm').reset();
            document.getElementById('ngayGhi').valueAsDate = new Date();
        }).catch(err => {
            alert("Có lỗi xảy ra, vui lòng thử lại!");
            btnSubmit.innerText = oldText;
            btnSubmit.disabled = false;
        });
    });

    // Vẽ biểu đồ mặc định (Giao diện giữ chỗ)
    let lineChart, barChart;
    
    function initCharts() {
        const ctxLine = document.getElementById('lineChart').getContext('2d');
        lineChart = new Chart(ctxLine, {
            type: 'line',
            data: {
                labels: ['27/7', '28/7', '29/7', '30/7', '31/7', '1/8', '2/8'],
                datasets: [{
                    label: 'Tổng SL phát ra (m³)',
                    data: [41200, 42500, 41800, 43000, 45100, 44200, 43800],
                    borderColor: '#2563eb',
                    backgroundColor: 'rgba(37, 99, 235, 0.1)',
                    borderWidth: 2,
                    fill: true,
                    tension: 0.3
                }]
            },
            options: { plugins: { title: { display: true, text: 'Diễn biến sản lượng từng ngày' } } }
        });

        const ctxBar = document.getElementById('barChart').getContext('2d');
        barChart = new Chart(ctxBar, {
            type: 'bar',
            data: {
                labels: ['XNTP1', 'XNTP2', 'Mai Sơn', 'Mộc Châu', 'Yên Châu'],
                datasets: [{
                    label: 'Sản lượng (m³)',
                    data: [315182, 198401, 172135, 97617, 31686],
                    backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#6366f1', '#ec4899']
                }]
            },
            options: { plugins: { title: { display: true, text: 'So sánh sản lượng các đơn vị' } } }
        });
    }

    initCharts();

    // Nút Đồng bộ - Hiện tại sẽ chạy animation loading để demo
    document.getElementById('btnLoc').addEventListener('click', function() {
        const btn = this;
        const oldText = btn.innerText;
        btn.innerText = "Đang tải dữ liệu...";
        btn.disabled = true;
        
        // Mô phỏng call API mất 1 giây
        setTimeout(() => {
            btn.innerText = oldText;
            btn.disabled = false;
            
            // Random số liệu để test UI
            document.getElementById('kpiTong').innerHTML = Math.floor(Math.random() * 500000 + 1000000).toLocaleString() + ' <span class="text-lg font-normal">m³</span>';
            document.getElementById('kpiTB').innerHTML = Math.floor(Math.random() * 5000 + 38000).toLocaleString() + ' <span class="text-lg font-normal">m³</span>';
            document.getElementById('kpiMax').innerHTML = Math.floor(Math.random() * 5000 + 45000).toLocaleString() + ' <span class="text-lg font-normal">m³</span>';
        }, 1000);
    });
  </script>
</body>
</html>
